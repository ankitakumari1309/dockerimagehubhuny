
name: CI/CD for Dockerized Flask App

# Trigger workflow on push or pull request to main
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  # JOB 1: Build Docker Image
  dockerbuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build . \
            --file Dockerfile \
            --tag workflow-test:${{ github.sha }}


  # JOB 2: Install dependencies and run tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Run tests
        run: pytest


  # JOB 3: Build and publish Docker image
  build-and-publish:
    needs: [dockerbuild, build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build-and-publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flasktest-app:latest
            ${{ secrets.DOCKER_USERNAME }}/flasktest-app:${{ github.sha }}

      - name: Image digest
        run: echo "${{ steps.build-and-publish.outputs.digest }}"
